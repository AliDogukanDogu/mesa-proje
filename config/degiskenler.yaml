# Degisken kayit defteri. SORUMLU: C (Plan gorev C-2).
# Kapsam belgesindeki "Degisken seti" tablosundaki 24 adayi icerir.
# Zorunlu alanlar: id, grup, kaynak, hesap, beklenen_yon, dalga, durum
#   beklenen_yon: negatif | pozitif | belirsiz
#   durum: aday | aktif | izleme | emekli

degiskenler:
  # --- Dalga 1: Piyasa ve Risk Degiskenleri (Must) ---
  - id: z_sapma_20
    grup: 1
    kaynak: fiyat
    hesap: "(kapanis - 20g ort) / 20g std"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: z_sapma_5
    grup: 1
    kaynak: fiyat
    hesap: "(kapanis - 5g ort) / 5g std"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: z_sapma_60
    grup: 1
    kaynak: fiyat
    hesap: "(kapanis - 60g ort) / 60g std"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: z_sapma_250
    grup: 1
    kaynak: fiyat
    hesap: "(kapanis - 250g ort) / 250g std"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: rsi_14
    grup: 1
    kaynak: fiyat
    hesap: "RSI(14)"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: bollinger_konum
    grup: 1
    kaynak: fiyat
    hesap: "(kapanis - alt bant) / (ust bant - alt bant), 20g, 2 std"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: hacim_oran
    grup: 1
    kaynak: fiyat
    hesap: "bugunku hacim / 20g hacim ortalamasi"
    beklenen_yon: belirsiz
    dalga: 1
    durum: aday

  - id: vix_seviye
    grup: 1
    kaynak: piyasa
    hesap: "VIX duzeyi"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: vix_5g
    grup: 1
    kaynak: piyasa
    hesap: "VIX 5 gunluk % degisim"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: dxy_20g
    grup: 1
    kaynak: piyasa
    hesap: "DXY 20 gunluk % degisim"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: abd10y_20g
    grup: 1
    kaynak: piyasa
    hesap: "ABD 10 yillik faiz 20 gunluk degisim (bp)"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: brent_1h
    grup: 1
    kaynak: piyasa
    hesap: "Brent haftalik % degisim"
    beklenen_yon: belirsiz
    dalga: 1
    durum: aday

  - id: altin_1h
    grup: 1
    kaynak: piyasa
    hesap: "Altin haftalik % degisim"
    beklenen_yon: negatif
    dalga: 1
    durum: aday

  - id: bakir_1h
    grup: 1
    kaynak: piyasa
    hesap: "Bakir haftalik % degisim"
    beklenen_yon: pozitif
    dalga: 1
    durum: aday

  - id: beta_60
    grup: 1
    kaynak: piyasa
    hesap: "60 gunluk hisse-XU100 betasi"
    beklenen_yon: belirsiz
    dalga: 1
    durum: aday

  # --- Dalga 2: Makroekonomi Degiskenleri (Should) ---
  - id: politika_faizi_deg
    grup: 2
    kaynak: makro
    hesap: "Son karar degisimi (bp), yayin gecikmeli"
    beklenen_yon: negatif
    dalga: 2
    durum: aday

  - id: reel_faiz
    grup: 2
    kaynak: makro
    hesap: "Politika faizi - yillik TUFE"
    beklenen_yon: negatif
    dalga: 2
    durum: aday

  - id: tufe_deg
    grup: 2
    kaynak: makro
    hesap: "Yillik TUFE aylik degisimi"
    beklenen_yon: negatif
    dalga: 2
    durum: aday

  - id: usdtry_20g
    grup: 2
    kaynak: piyasa
    hesap: "USD/TRY 20 gunluk % degisim"
    beklenen_yon: belirsiz
    dalga: 2
    durum: aday

  # --- Dalga 3: Haber ve Olay Degiskenleri (Could) ---
  - id: haber_skoru
    grup: 4
    kaynak: haber
    hesap: "Haberlerin yon x siddet/5 toplami (5g/20g sonum)"
    beklenen_yon: pozitif
    dalga: 3
    durum: aday

  # --- Dalga 4: Takvim ve Duygu Degiskenleri ---
  - id: takvim_bayram
    grup: 7
    kaynak: takvim
    hesap: "Bayram oncesi/sonrasi 5 gun kuklasi"
    beklenen_yon: belirsiz
    dalga: 4
    durum: aday

  - id: takvim_tatil
    grup: 7
    kaynak: takvim
    hesap: "Okul ve yaz tatili kuklasi"
    beklenen_yon: belirsiz
    dalga: 4
    durum: aday

  - id: tuketici_guven
    grup: 7
    kaynak: makro
    hesap: "Tuketici guven endeksi aylik degisimi"
    beklenen_yon: pozitif
    dalga: 4
    durum: aday

  # --- Kontrol Degiskeni (Oz-Sinav) ---
  - id: rastgele_kontrol
    grup: 0
    kaynak: yok
    hesap: "N(0,1) gurultu, sabit tohum"
    beklenen_yon: belirsiz
    dalga: 1
    durum: aday